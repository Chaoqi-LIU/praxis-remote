[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-remote"
version = "0.1.0"
description = "Generic remote policy inference transport."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Chaoqi Liu", email = "liuchaoqi730@gmail.com" },
]
dependencies = [
    "grpcio>=1.80.0",
    "numpy>=1.26.0",
    "protobuf>=6.31.1",
]

[project.urls]
Author = "https://chaoqi-liu.com"
Homepage = "https://github.com/Chaoqi-LIU/praxis-remote"
Repository = "https://github.com/Chaoqi-LIU/praxis-remote"
Issues = "https://github.com/Chaoqi-LIU/praxis-remote/issues"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.80.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
praxis_remote = ["py.typed", "proto/*.proto", "proto/*.pyi"]

[tool.ruff]
target-version = "py310"
line-length = 88
force-exclude = true
extend-exclude = [
    "src/praxis_remote/proto/*_pb2.py",
    "src/praxis_remote/proto/*_pb2.pyi",
    "src/praxis_remote/proto/*_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["praxis_remote"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
