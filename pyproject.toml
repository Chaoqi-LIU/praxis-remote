[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-remote"
version = "0.1.1"
description = "Generic remote policy inference transport."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Chaoqi Liu" },
    { email = "liuchaoqi730@gmail.com" },
]
maintainers = [
    { name = "Chaoqi Liu" },
    { email = "liuchaoqi730@gmail.com" },
]
keywords = [
    "robotics",
    "grpc",
    "inference",
    "policy",
    "remote",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.80.0",
    "numpy>=1.26.0",
    "protobuf>=6.31.1",
]

[project.urls]
Homepage = "https://chaoqi-liu.com"
Source = "https://github.com/Chaoqi-LIU/praxis-remote"
Issues = "https://github.com/Chaoqi-LIU/praxis-remote/issues"
Documentation = "https://github.com/Chaoqi-LIU/praxis-remote#readme"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.80.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
praxis_remote = ["py.typed", "proto/*.proto", "proto/*.pyi"]

[tool.ruff]
target-version = "py310"
line-length = 88
force-exclude = true
extend-exclude = [
    "src/praxis_remote/proto/*_pb2.py",
    "src/praxis_remote/proto/*_pb2.pyi",
    "src/praxis_remote/proto/*_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["praxis_remote"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
